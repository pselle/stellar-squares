name: Build Project and Run Tests

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  PKG_CONFIG_PATH: /usr/lib/pkgconfig
  # The gallery contract resolves `oz/nft-standard` from the Stellar Registry at
  # build time. These tell that lookup which network to read; the account only
  # sources read-only simulations, so no secret key is needed.
  STELLAR_NETWORK: testnet
  STELLAR_ACCOUNT: GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWHF

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            runner/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      # Add the wasm32v1-none target for building contracts
      - run: rustup target add wasm32v1-none
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libdbus-1-dev pkg-config
      # Install binstall to quickly install stellar-scaffold-cli
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      # Check for stellar-scaffold-cli binary and install if not present
      # scaffold.yml version 2 needs Scaffold 0.0.28 or later. binstall skips the
      # download when the cached binary is already this version.
      - name: Install stellar-scaffold
        run: cargo binstall -y --locked stellar-scaffold-cli@0.0.28
      # The Registry macros shell out to `stellar registry` during cargo build
      - name: Check for stellar and stellar-registry binaries
        run: |
          if ! command -v stellar &> /dev/null; then
            cargo binstall -y --locked stellar-cli
          fi
          if ! command -v stellar-registry &> /dev/null; then
            cargo binstall -y --locked stellar-registry-cli
          fi
      - run: npm ci
      - name: Build with Scaffold and build client packages
        run: stellar-scaffold build --build-clients --network testnet 2>&1 | tee build_clients.log
      - name: Check client generation summary
        run: |
          # Extract the number after "Failed: "
          FAILED=$(grep -Eo "Failed: [0-9]+" build_clients.log | awk '{print $2}')
          if [ -z "$FAILED" ]; then
            echo "Could not find 'Failed: N' in build_clients.log, all clients succeeded."
            exit 0
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "Client generation summary check failed: Failed: $FAILED"
            echo "Check the \"Build with Scaffold\" step logs."
            exit 1
          fi
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: Run contract tests
        run: cargo test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Run end-to-end smoke tests
        run: npm run test:e2e
