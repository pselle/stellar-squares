### Development environment configuration
[development.network]
rpc-url = "http://localhost:8000/rpc"
network-passphrase = "Standalone Network ; February 2017"
run-locally = true # automatically start the local network container, if not already running

[[development.accounts]]
name = "me" # Required. Keys for this account will be saved to `./.stellar/identity`

[development.contracts]
nft_sequential_minting_example = { client = true, constructor_args = "--owner me --name 'Importantdocs' --uri 'myURI' --symbol 'IDOC'" }

[development.contracts.squares_gallery]
client = true
# Hash of the `oz/nft-standard` 0.7.2 Wasm from the Stellar Registry, which the gallery
# deploys collections from. It must be uploaded to the local network once; see the README.
constructor_args = "--owner me --nft_wasm_hash b0b3520386c85109faee8333b41bbfbf7779e1de203b77a4a3c9c0cd48aaaee6 --xlm_sac $(stellar contract id asset --asset native)"
after_deploy = """
deploy_collection --base_uri "https://example.com/mynft/" --name "Squares Gallery" --symbol "SSQ" --collection_size 20 --item_price 100000000 # 10 XLM
"""

